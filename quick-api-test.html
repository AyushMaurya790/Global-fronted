<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Test - Countries API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-btn { background: #e55d17; color: white; padding: 10px 20px; border: none; border-radius: 5px; margin: 10px; cursor: pointer; }
        .result { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; white-space: pre-wrap; }
        .continent { display: inline-block; margin: 5px; padding: 8px 15px; background: #007bff; color: white; border-radius: 20px; cursor: pointer; }
        .continent:hover { background: #0056b3; }
        #countries { margin: 20px 0; }
        .country { display: block; padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>🚀 Quick API Test</h1>
    
    <button class="test-btn" onclick="testContinents()">Test Continents API</button>
    <button class="test-btn" onclick="testOceaniaCountries()">Test OCEANIA Countries</button>
    <button class="test-btn" onclick="testAsiaCountries()">Test ASIA Countries</button>
    
    <div id="result" class="result">Click a button to test APIs...</div>
    
    <div id="continents"></div>
    <div id="countries"></div>

    <script>
        async function testContinents() {
            const result = document.getElementById('result');
            result.textContent = 'Loading continents...';
            
            try {
                const response = await fetch('http://globe.ridealmobility.com/api/continents');
                const data = await response.json();
                
                result.textContent = `SUCCESS! Got ${data.length} continents:\n${JSON.stringify(data, null, 2)}`;
                
                // Show clickable continents
                const continentsDiv = document.getElementById('continents');
                continentsDiv.innerHTML = '<h3>Click a continent to get countries:</h3>';
                
                data.forEach(continent => {
                    const div = document.createElement('div');
                    div.className = 'continent';
                    div.textContent = continent.name;
                    div.onclick = () => testCountries(continent._id, continent.name);
                    continentsDiv.appendChild(div);
                });
                
            } catch (error) {
                result.textContent = `ERROR: ${error.message}`;
            }
        }
        
        async function testCountries(continentId, continentName) {
            const result = document.getElementById('result');
            result.textContent = `Loading countries for ${continentName}...`;
            
            try {
                const response = await fetch(`http://globe.ridealmobility.com/api/countries?continentId=${continentId}`);
                const data = await response.json();
                
                result.textContent = `SUCCESS! Got ${data.length} countries for ${continentName}:\n${JSON.stringify(data, null, 2)}`;
                
                // Show countries
                const countriesDiv = document.getElementById('countries');
                countriesDiv.innerHTML = `<h3>Countries in ${continentName}:</h3>`;
                
                data.forEach(country => {
                    const div = document.createElement('div');
                    div.className = 'country';
                    div.textContent = country.name;
                    countriesDiv.appendChild(div);
                });
                
            } catch (error) {
                result.textContent = `ERROR: ${error.message}`;
            }
        }
        
        async function testOceaniaCountries() {
            await testCountries('68bffc49cd2575bd4c4611f8', 'OCEANIA');
        }
        
        async function testAsiaCountries() {
            await testCountries('68bffbfccd2575bd4c4611f0', 'ASIA');
        }
    </script>
</body>
</html>
