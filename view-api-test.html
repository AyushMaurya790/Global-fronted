<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .activity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .activity-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .activity-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }
        .overview-section {
            margin: 20px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        pre {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>View API Test - New Zealand Overview</h1>
    
    <div class="test-section">
        <h2>API Endpoint</h2>
        <p><strong>URL:</strong> http://globe.ridealmobility.com/api/view/68c7e093c65039db3a688c25</p>
        <button onclick="testAPI()">Test API</button>
        <div id="status"></div>
    </div>

    <div class="test-section">
        <h2>Raw API Response</h2>
        <pre id="rawResponse">Loading...</pre>
    </div>

    <div class="test-section">
        <h2>Features Preview</h2>
        <div id="activitiesGrid" class="activity-grid">
            Loading features...
        </div>
    </div>

    <div class="test-section">
        <h2>Overview Text</h2>
        <div id="overviewText" class="overview-section">
            Loading overview...
        </div>
    </div>

    <script>
        async function testAPI() {
            const statusDiv = document.getElementById('status');
            const rawResponseDiv = document.getElementById('rawResponse');
            const activitiesDiv = document.getElementById('activitiesGrid');
            const overviewDiv = document.getElementById('overviewText');

            try {
                statusDiv.innerHTML = '<span style="color: orange;">Fetching data...</span>';
                
                const response = await fetch('http://globe.ridealmobility.com/api/view/68c7e093c65039db3a688c25', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('View API Response:', data);

                // Display raw response
                rawResponseDiv.textContent = JSON.stringify(data, null, 2);
                
                // Display activities
                displayActivities(data, activitiesDiv);
                
                // Display overview
                displayOverview(data, overviewDiv);

                statusDiv.innerHTML = '<span style="color: green;">✅ API call successful!</span>';

            } catch (error) {
                console.error('Error fetching view data:', error);
                statusDiv.innerHTML = `<span style="color: red;">❌ Error: ${error.message}</span>`;
                rawResponseDiv.textContent = `Error: ${error.message}`;
            }
        }

        function getImageUrl(imagePath) {
            if (!imagePath) {
                return 'https://via.placeholder.com/300x150?text=No+Image';
            }

            if (imagePath.startsWith('http://') || imagePath.startsWith('https://')) {
                return imagePath;
            } else if (imagePath.startsWith('/')) {
                return `http://globe.ridealmobility.com${imagePath}`;
            } else {
                return `http://globe.ridealmobility.com/${imagePath}`;
            }
        }

        function displayActivities(data, container) {
            if (!data || !data.features || !Array.isArray(data.features)) {
                container.innerHTML = '<p>No features found in API response</p>';
                return;
            }

            // Display all features from API
            const features = data.features;
            
            container.innerHTML = features.map((feature, index) => `
                <div class="activity-card">
                    <img src="${getImageUrl(feature.icon)}" alt="${feature.title || `Feature ${index + 1}`}" 
                         onerror="this.src='https://via.placeholder.com/300x150?text=Feature+${index + 1}'">
                    <h3>${feature.title || `Feature ${index + 1}`}</h3>
                    <p>${feature.description || 'No description available'}</p>
                </div>
            `).join('');

            console.log(`Displayed ${features.length} features`);
        }

        function displayOverview(data, container) {
            if (!data || !data.description) {
                container.innerHTML = '<p>No description found in API response</p>';
                return;
            }

            let overviewHTML = `
                <h3>Overview</h3>
                <p><strong>${data.heading || 'Main Heading'}:</strong><br>${data.description}</p>
            `;

            // Add country information if available
            if (data.country) {
                overviewHTML += `
                    <p><strong>Country Info:</strong> ${data.country.info || 'No additional info'}</p>
                    <h4>Country Details</h4>
                    <p><strong>Country:</strong> ${data.country.name || 'N/A'}</p>
                    <p><strong>Continent:</strong> ${data.country.continent?.name || 'N/A'}</p>
                    <p><strong>Capital:</strong> ${data.country.capital || 'N/A'}</p>
                    <p><strong>Currency:</strong> ${data.country.currency || 'N/A'}</p>
                    <p><strong>Visa:</strong> ${data.country.visa || 'N/A'}</p>
                    <p><strong>Timezone:</strong> ${data.country.timezone || 'N/A'}</p>
                    <p><strong>Country Heading:</strong> ${data.country.heading || 'N/A'}</p>
                    <p><strong>Country Title:</strong> ${data.country.title || 'N/A'}</p>
                `;
            }

            container.innerHTML = overviewHTML;

            console.log('Overview data displayed');
        }

        // Auto-test on page load
        document.addEventListener('DOMContentLoaded', function() {
            testAPI();
        });
    </script>
</body>
</html>
